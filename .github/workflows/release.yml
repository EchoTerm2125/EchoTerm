name: Build Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Sync version from release tag
        # Release tags carry the version (v0.1.2, v0.2.0-beta.1). Stamp package.json
        # (minus the leading "v") so electron-builder builds with the version
        # matching the release, which the auto-updater's channel detection keys on.
        run: npm pkg set version="${GITHUB_REF_NAME#v}" --json=false
        shell: bash

      - name: Compile source
        run: npm run compile

      - name: Build NSIS installer and portable zip
        run: npx electron-builder --win nsis zip --publish never

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
